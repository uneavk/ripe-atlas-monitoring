name: Project checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r collector/requirements.txt
      - run: python -m compileall -q collector/app nifi tools bi
      - run: python tools/checks.py
      - name: Check generated documentation and exports
        run: |
          python tools/docs.py
          git diff --exit-code -- docs/FILES.md docs/DATABASE.md docs/ANALYTICS.md docs/KPI_DICTIONARY.csv bi/dashboard_spec.json
