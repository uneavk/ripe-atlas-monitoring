name: Python checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r collector/requirements.txt
      - run: python -m compileall -q collector/app nifi tools
      - run: python -m unittest discover -s collector/tests -p 'test_*.py' -v
        env:
          PYTHONPATH: collector
