name: ${COMPOSE_PROJECT_NAME:-ripe-monitoring}
services:
  metabase-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:?Set METABASE_DB_PASSWORD}
    volumes:
      - metabase_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U metabase -d metabase]
      interval: 5s
      timeout: 5s
      retries: 30
  metabase:
    image: metabase/metabase:v0.65.3
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_SITE_NAME: RIPE Atlas Ukraine
      MB_ANON_TRACKING_ENABLED: "false"
      JAVA_TIMEZONE: Europe/Kyiv
      JAVA_OPTS: -Xms256m -Xmx1536m
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${METABASE_PORT:-3000}:3000"
    depends_on:
      metabase-db:
        condition: service_healthy
volumes:
  metabase_data:
networks:
  default:
    external: true
    name: ${BI_DOCKER_NETWORK:-ripe-monitoring_default}
